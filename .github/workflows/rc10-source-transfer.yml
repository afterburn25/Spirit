name: RC10 source transfer validation
on:
  push:
    branches: [work/rc10-source-transfer]
    paths: [.github/workflows/rc10-source-transfer.yml]
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 456e8dc82e8013605494f60a5af48d3f1f4d44ff
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.4'
          extensions: openssl, posix, fileinfo, gd, curl, zip
          coverage: none
      - name: Verify transfer hashes and reconstruct exact source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,base64,pathlib,hashlib,gzip,subprocess
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'transfer';out.mkdir()
          shas=['5184f32e75b9b42c1e850c7f04641ff508cb3f55','235c54ba00b0f959dcaaf5295d572829b8e7f53e','884e5addcd73347520df4d8b94f2c7b441875041']
          repairs={1:[],2:[[2557,2559,''],[9468,9468,'g=']],3:[[6734,6735,''],[9108,9108,'A']]}
          pieces=[]
          for i,sha in enumerate(shas,1):
              req=urllib.request.Request('https://api.github.com/repos/afterburn25/Spirit/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=30) as response: data=json.load(response)
              text=base64.b64encode(base64.b64decode(data['content'])).decode()
              for start,end,value in reversed(repairs[i]): text=text[:start]+value+text[end:]
              pieces.append(base64.b64decode(text,validate=True))
          packed=b''.join(pieces)
          assert hashlib.sha256(packed).hexdigest()=='d8b56997a9fb052449d553b21281f23cc35f7cb7d10409f84836c52dcf1c9255'
          raw=gzip.decompress(packed)
          assert hashlib.sha256(raw).hexdigest()=='45ef727fdb01c0c8496f71855273c8273e117c8f7b2ad4a8339774499f4c7451'
          script=out/'source-transfer.py';script.write_bytes(raw)
          subprocess.run(['python3',str(script)],check=True)
          PY
      - name: Verify syntax, package contract and deterministic build
        run: |
          python3 -m pip install --disable-pip-version-check Pillow==12.3.0
          find admin app config includes install -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          python3 app/tests/package_test.py
          python3 app/tools/release_gate.py
          python3 app/tools/package.py --output "$RUNNER_TEMP/transfer/package"
      - name: Publish exact Git objects only; never update a branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import subprocess,os,json,urllib.request,base64,pathlib,time
          api='https://api.github.com/repos/afterburn25/Spirit/git/'
          def post(kind,payload):
              time.sleep(1.05)
              req=urllib.request.Request(api+kind,data=json.dumps(payload).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=30) as response:return json.load(response)
          original={line.split()[2] for line in subprocess.check_output(['git','ls-tree','-r','HEAD'],text=True).splitlines()}
          entries=[];uploaded=set()
          for line in subprocess.check_output(['git','ls-files','-s'],text=True).splitlines():
              metadata,path=line.split('\t',1);mode,sha,stage=metadata.split()
              assert stage=='0'
              if sha not in original and sha not in uploaded:
                  raw=subprocess.check_output(['git','cat-file','blob',sha])
                  result=post('blobs',{'content':base64.b64encode(raw).decode(),'encoding':'base64'})
                  assert result['sha']==sha
                  uploaded.add(sha)
              entries.append({'path':path,'mode':mode,'type':'blob','sha':sha})
          tree=post('trees',{'tree':entries})['sha']
          assert tree=='964b4c8e2d8c2154d1ceaa0698eb0ad35a1393ff'
          receipt={'tree':tree,'parent':'456e8dc82e8013605494f60a5af48d3f1f4d44ff','uploaded_blobs':len(uploaded),'tracked_files':len(entries),'branch_updated':False}
          print(json.dumps(receipt,indent=2))
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'transfer/TREE.json').write_text(json.dumps(receipt,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Spirit-rc10-verified-source
          path: |
            ${{ runner.temp }}/transfer/TREE.json
            ${{ runner.temp }}/transfer/package/*
          retention-days: 14
          if-no-files-found: error

name: Help Center quality
on:
  push:
    branches: [main, work/1.2.0-content-band-layout]
    paths:
      - 'app/HelpCatalog.php'
      - 'assets/css/admin-media-preview.css'
      - 'assets/js/admin-media-preview.js'
      - 'admin/content/**'
      - 'app/ContentAdmin.php'
      - 'app/ContentSchema.php'
      - 'app/SectionPages.php'
      - 'app/MemberOnboarding.php'
      - 'admin/content/import-lineup.php'
      - 'app/views/public/sections.php'
      - 'app/views/public/store.php'
      - 'admin/help/**'
      - 'app/AdminNavigation.php'
      - 'app/tests/help_catalog_check.php'
      - 'app/tests/page_controls_check.php'
      - 'assets/css/admin-help.css'
      - '.github/workflows/help-center-quality.yml'
  pull_request:
    paths:
      - 'app/HelpCatalog.php'
      - 'assets/css/admin-media-preview.css'
      - 'assets/js/admin-media-preview.js'
      - 'admin/content/**'
      - 'app/ContentAdmin.php'
      - 'app/ContentSchema.php'
      - 'app/SectionPages.php'
      - 'app/MemberOnboarding.php'
      - 'admin/content/import-lineup.php'
      - 'app/views/public/sections.php'
      - 'app/views/public/store.php'
      - 'app/tests/page_controls_check.php'
      - 'admin/help/**'
      - 'app/AdminNavigation.php'
      - 'app/tests/help_catalog_check.php'
      - 'assets/css/admin-help.css'
      - '.github/workflows/help-center-quality.yml'
concurrency:
  group: help-center-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  check-help:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Syntax check
        run: |
          php -l app/HelpCatalog.php
          php -l admin/help/index.php
          php -l app/AdminNavigation.php
          php -l app/tests/help_catalog_check.php
      - name: Help content and endpoint integrity
        run: php app/tests/help_catalog_check.php
      - name: Content editor and Band layout invariants
        run: |
          php -l app/tests/page_controls_check.php
          php -l app/ContentSchema.php
          php -l app/SectionPages.php
          php -l app/ContentAdmin.php
          php -l app/MemberOnboarding.php
          php -l admin/content/import-lineup.php
          php -l admin/content/edit.php
          php -l admin/content/delete.php
          node --check assets/js/admin-media-preview.js
          php -l app/views/public/sections.php
          php -l app/views/public/store.php
          php -l app/views/header.php
          php app/tests/page_controls_check.php

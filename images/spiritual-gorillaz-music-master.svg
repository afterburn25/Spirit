<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1000" role="img" aria-labelledby="t d">
<title id="t">Spiritual Gorillaz music artwork</title>
<desc id="d">Gorilla in premium headphones lit by dark blue and warm gold studio light with copy space on the left.</desc>
<defs>
  <linearGradient id="bgm" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#02070d"/><stop offset=".55" stop-color="#08131c"/><stop offset="1" stop-color="#26180d"/>
  </linearGradient>
  <radialGradient id="amber" cx=".82" cy=".3" r=".48">
    <stop offset="0" stop-color="#d98b39" stop-opacity=".38"/><stop offset=".5" stop-color="#8b4c19" stop-opacity=".14"/><stop offset="1" stop-color="#201207" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="furm" x1=".1" y1=".1" x2=".9" y2=".9">
    <stop offset="0" stop-color="#303d45"/><stop offset=".36" stop-color="#11191e"/><stop offset=".76" stop-color="#05080b"/><stop offset="1" stop-color="#1b2328"/>
  </linearGradient>
  <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f2c86b"/><stop offset=".5" stop-color="#8c5f24"/><stop offset="1" stop-color="#24170b"/>
  </linearGradient>
  <filter id="sm"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".72"/></filter>
</defs>
<rect width="1800" height="1000" fill="url(#bgm)"/><rect width="1800" height="1000" fill="url(#amber)"/>
<g opacity=".18" stroke="#4aaee8" stroke-width="12"><path d="M1060 0l-190 760"/><path d="M1290 0l-80 690"/></g>

<!-- Headphone band -->
<path d="M1320 122c-222-40-415 90-467 328" fill="none" stroke="#151b20" stroke-width="78" stroke-linecap="round" filter="url(#sm)"/>
<path d="M1318 122c-215-33-385 76-444 305" fill="none" stroke="url(#metal)" stroke-width="22" stroke-linecap="round"/>

<!-- Gorilla -->
<g transform="translate(870 115)" filter="url(#sm)">
  <path d="M360 35C180 40 64 154 31 320c-43 214 41 491 173 638 84 94 187 136 308 136 130 0 239-52 323-159 117-148 179-410 131-616C923 153 761 35 588 35Z" fill="url(#furm)" stroke="#070b0e" stroke-width="24"/>
  <path d="M207 286c91-89 221-105 303-42M580 246c88-47 199-15 252 58" fill="none" stroke="#4d5960" stroke-width="24" stroke-linecap="round"/>
  <path d="M220 392c85-64 177-63 249-12-91 9-168 18-249 12Zm393 3c74-53 164-52 239 17-80 3-161-5-239-17Z" fill="#05080a"/>
  <ellipse cx="351" cy="387" rx="27" ry="15" fill="#b86730"/><ellipse cx="709" cy="399" rx="27" ry="15" fill="#b86730"/>
  <path d="M347 487c63-59 214-61 281 0 48 43 57 132 19 196-49 82-249 84-315 2-52-64-34-148 15-198Z" fill="#111920" stroke="#26353e" stroke-width="16"/>
  <ellipse cx="437" cy="560" rx="46" ry="31" fill="#020405"/><ellipse cx="578" cy="560" rx="46" ry="31" fill="#020405"/>
  <path d="M371 717c78 50 195 51 272 0-32 94-86 136-137 136-57 0-108-45-135-136Z" fill="#070b0e" stroke="#1c292f" stroke-width="14"/>
</g>

<!-- Ear cup -->
<g transform="translate(1345 310)" filter="url(#sm)">
  <ellipse cx="130" cy="190" rx="175" ry="225" fill="#0c1115" stroke="#6f4b1e" stroke-width="22"/>
  <ellipse cx="130" cy="190" rx="130" ry="172" fill="#11181d" stroke="url(#metal)" stroke-width="20"/>
  <circle cx="130" cy="190" r="78" fill="#060a0d" stroke="#b37d31" stroke-width="12"/>
  <path d="M91 170l39 31 43-57 41 57 36-31-16 88H106Z" fill="#d8a844"/>
</g>

<!-- Left readability veil -->
<rect x="0" y="0" width="980" height="1000" fill="url(#bgm)" opacity=".82"/>
</svg>
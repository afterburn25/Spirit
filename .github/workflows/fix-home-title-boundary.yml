name: Fix Home title boundary
on:
  push:
    branches: [work/concept-exact-rebuild]
    paths:
      - .github/workflows/fix-home-title-boundary.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: work/concept-exact-rebuild
          persist-credentials: true
      - name: Constrain the Home title to the dark copy panel
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          css_path = Path('assets/css/section-pages.css')
          css = css_path.read_text(encoding='utf-8')
          marker = '/* === STRICT HOME TITLE BOUNDARY === */'
          if marker in css:
              raise RuntimeError('Strict Home title boundary already exists')
          css += r'''

          /* === STRICT HOME TITLE BOUNDARY === */
          /* The title has its own safe column; the intro and buttons may use the wider copy column. */
          .concept-home h1{
            width:min(100%,430px);
            max-width:430px;
            min-width:0;
            font-size:clamp(40px,3.75vw,50px);
            line-height:.98;
            letter-spacing:-.04em;
            text-wrap:initial;
            overflow-wrap:normal;
            word-break:normal;
          }
          .concept-home h1 em{font-size:1.05em}
          @media(max-width:1100px){
            .concept-home h1{width:min(100%,380px);max-width:380px;font-size:42px}
          }
          @media(max-width:820px){
            .concept-home h1{width:min(100%,250px);max-width:250px;font-size:32px;line-height:1}
          }
          @media(max-width:600px){
            .concept-home h1{width:min(100%,205px);max-width:205px;font-size:29px;line-height:1;letter-spacing:-.045em}
          }
          @media(max-width:420px){
            .concept-home h1{width:min(100%,195px);max-width:195px;font-size:28px}
          }
          '''
          css_path.write_text(css, encoding='utf-8')

          test_path = Path('tests/concept_preview.py')
          test = test_path.read_text(encoding='utf-8')
          old = """                        if page.evaluate('document.documentElement.scrollWidth > window.innerWidth + 1'):\n                            raise AssertionError(f'{name} overflows horizontally at {width}px')\n                        page.screenshot("""
          new = """                        if page.evaluate('document.documentElement.scrollWidth > window.innerWidth + 1'):\n                            raise AssertionError(f'{name} overflows horizontally at {width}px')\n                        if name == 'home':\n                            metrics = page.locator('.concept-home h1').evaluate(\"\"\"\n                                node => {\n                                    const box = node.getBoundingClientRect();\n                                    const segments = [];\n                                    for (const child of node.childNodes) {\n                                        if (child.nodeType === 3 && child.textContent.trim()) {\n                                            const range = document.createRange();\n                                            range.selectNodeContents(child);\n                                            segments.push([...range.getClientRects()].map(rect => ({left: rect.left, right: rect.right})));\n                                        } else if (child.nodeType === 1 && child.tagName !== 'BR') {\n                                            const range = document.createRange();\n                                            range.selectNodeContents(child);\n                                            segments.push([...range.getClientRects()].map(rect => ({left: rect.left, right: rect.right})));\n                                        }\n                                    }\n                                    return {\n                                        left: box.left,\n                                        right: box.right,\n                                        clientWidth: node.clientWidth,\n                                        scrollWidth: node.scrollWidth,\n                                        segments,\n                                    };\n                                }\n                            \"\"\")\n                            invalid_segments = [\n                                segment for segment in metrics['segments']\n                                if len(segment) != 1\n                                or segment[0]['left'] < metrics['left'] - 1\n                                or segment[0]['right'] > metrics['right'] + 1\n                            ]\n                            if metrics['scrollWidth'] > metrics['clientWidth'] + 1 or len(metrics['segments']) != 3 or invalid_segments:\n                                raise AssertionError(f'Home title leaves its copy container at {width}px: {metrics}')\n                        page.screenshot("""
          if old not in test:
              raise RuntimeError('Concept preview insertion point not found')
          test_path.write_text(test.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit boundary fix and remove one-time workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-home-title-boundary.yml
          git add assets/css/section-pages.css tests/concept_preview.py
          git commit -m "fix: keep Home title inside the copy panel"
          git push origin HEAD:work/concept-exact-rebuild

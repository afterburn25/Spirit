name: Public cPanel contract reference
on:
  push:
    branches: [work/single-page-installer]
    paths: [.github/workflows/cpanel-reference.yml]
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - name: Download official public documentation only
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/cpanel-reference"
          for item in user-management/mysql-get_restrictions user-management/mysql-create_user user-management/mysql-list_users user-management/mysql-set_privileges_on_database database-management/mysql-list_databases database-management/mysql-create_database; do
            curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 20 "https://api.docs.cpanel.net/specifications/cpanel.openapi/$item.md" -o "$RUNNER_TEMP/cpanel-reference/${item##*/}.md"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cpanel-public-contract-reference
          path: ${{ runner.temp }}/cpanel-reference/*.md
          retention-days: 1

name: Fix upgrade test upload limit
on:
  push:
    branches:
      - work/concept-exact-rebuild
    paths:
      - .github/workflows/fix-upgrade-test-upload-limit.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: work/concept-exact-rebuild
          persist-credentials: true
      - name: Patch the isolated PHP fixture
        run: python3 tools/fix_upgrade_test_upload_limit.py
      - name: Commit test-fixture correction
        run: |
          set -euo pipefail
          python3 -m py_compile tests/http_integration.py tests/upgrade_integration.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-upgrade-test-upload-limit.yml tools/fix_upgrade_test_upload_limit.py
          git add tests/http_integration.py tests/upgrade_integration.py
          git commit -m "test: allow production-size upgrade packages in integration fixture"
          git push origin HEAD:work/concept-exact-rebuild

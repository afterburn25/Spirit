name: Website and installer verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integration:
    name: PHP ${{ matrix.php }} / ${{ matrix.database }}
    # Same assertions and PHP/database matrix; use the available Ubuntu22 pool.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            database: 'mariadb:11.4'
          - php: '8.4'
            database: 'mysql:8.4'
    services:
      database:
        image: ${{ matrix.database }}
        env:
          MYSQL_ROOT_PASSWORD: ephemeral-ci-root-not-production
          MYSQL_DATABASE: spirit_ci
          MYSQL_USER: spirit_ci
          MYSQL_PASSWORD: ephemeral-ci-user-not-production
        ports:
          - 3306:3306
    env:
      SPIRIT_TESTING: '1'
      SPIRIT_DISABLE_PAYMENT_NETWORK: '1'
      SPIRIT_DB_HOST: 127.0.0.1
      SPIRIT_DB_PORT: '3306'
      SPIRIT_DB_NAME: spirit_ci
      SPIRIT_DB_USER: spirit_ci
      SPIRIT_DB_PASSWORD: ephemeral-ci-user-not-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Configure synthetic screenshot output
        run: echo "SPIRIT_SCREENSHOT_DIR=$RUNNER_TEMP/spirit-screenshots" >> "$GITHUB_ENV"
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, openssl, posix, fileinfo, gd, curl, zip
          coverage: none
      - name: Syntax and permission-aware unit tests
        run: |
          find . -type f \( -name '*.php' -o -name '*.inc' \) -print0 | xargs -0 -n1 php -l
          php tests/run.php
          php tests/storage.php
          php tests/foundation_paths.php
          php tests/manual_installer_unit.php
          php tests/launch_unit.php
          php tests/gallery_unit.php
          php tests/public_access_unit.php
          php tests/content_schema.php
          php tests/content_history_unit.php
          php tests/discovery_unit.php
          php tests/media_quality_unit.php
          php tests/communication_unit.php
          php tests/commerce_unit.php
          php tests/payment_unit.php
          php tests/staff_unit.php
          php tests/backup_unit.php
          php tests/upgrade_unit.php
          php tests/cleanup_unit.php
          python3 -m py_compile tools/package.py tests/*.py
          python3 tests/package_test.py
      - name: Database and HTTP integration
        run: |
          python3 tests/http_integration.py
          php tests/foundation_db.php
          python3 tests/content_integration.py
          python3 tests/content_history_integration.py
          python3 tests/discovery_integration.py
          python3 tests/media_quality_integration.py
          python3 tests/communication_integration.py
          python3 tests/smtp_integration.py
          python3 tests/manual_installer_integration.py
          python3 tests/launch_integration.py
          python3 tests/launch_extras_integration.py
          python3 tests/mail_acceptance.py
          python3 tests/commerce_integration.py
          python3 tests/payment_integration.py
          python3 tests/payment_http.py
          python3 tests/staff_integration.py
          python3 tests/backup_integration.py
          python3 tests/upgrade_integration.py
          python3 tests/cleanup_integration.py
      - name: Install test-only Chromium
        if: matrix.php == '8.4'
        run: |
          python3 -m venv "$RUNNER_TEMP/spirit-browser"
          "$RUNNER_TEMP/spirit-browser/bin/pip" install playwright==1.57.0
          "$RUNNER_TEMP/spirit-browser/bin/python" -m playwright install --with-deps chromium
      - name: Rendered installer and admin smoke checks
        if: matrix.php == '8.4'
        run: '"$RUNNER_TEMP/spirit-browser/bin/python" tests/browser_smoke.py'
      - name: Rendered public pages and persistent playback
        if: matrix.php == '8.4'
        run: '"$RUNNER_TEMP/spirit-browser/bin/python" tests/public_browser.py'
      - name: Rendered booking and communication workflows
        if: matrix.php == '8.4'
        run: '"$RUNNER_TEMP/spirit-browser/bin/python" tests/communication_browser.py'
      - name: Rendered commerce and customer workflows
        if: matrix.php == '8.4'
        run: '"$RUNNER_TEMP/spirit-browser/bin/python" tests/commerce_browser.py'
      - name: Rendered tokenization and order workflows
        if: matrix.php == '8.4'
        run: '"$RUNNER_TEMP/spirit-browser/bin/python" tests/payment_browser.py'
      - name: Rendered owner invitation and staff permissions
        if: matrix.php == '8.4'
        run: '"$RUNNER_TEMP/spirit-browser/bin/python" tests/staff_browser.py'
      - name: Rendered backup and restore workflows
        if: matrix.php == '8.4'
        run: '"$RUNNER_TEMP/spirit-browser/bin/python" tests/backup_browser.py'
      - name: Rendered ZIP upgrade and independent recovery
        if: matrix.php == '8.4'
        run: '"$RUNNER_TEMP/spirit-browser/bin/python" tests/upgrade_browser.py'
      - name: Rendered conservative retention workflow
        if: matrix.php == '8.4'
        run: '"$RUNNER_TEMP/spirit-browser/bin/python" tests/cleanup_browser.py'
      - name: Rendered private content history and draft restoration
        if: matrix.php == '8.4'
        run: '"$RUNNER_TEMP/spirit-browser/bin/python" tests/content_history_browser.py'
      - name: Rendered published discovery and metadata navigation
        if: matrix.php == '8.4'
        run: '"$RUNNER_TEMP/spirit-browser/bin/python" tests/discovery_browser.py'
      - name: Rendered responsive images and keyboard quality
        if: matrix.php == '8.4'
        run: '"$RUNNER_TEMP/spirit-browser/bin/python" tests/media_quality_browser.py'
      - name: Rendered launch diagnostics and upload-limit feedback
        if: matrix.php == '8.4'
        run: '"$RUNNER_TEMP/spirit-browser/bin/python" tests/launch_browser.py'
      - name: Preserve synthetic browser screenshots
        if: always() && matrix.php == '8.4'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Spirit-browser-${{ github.sha }}
          path: ${{ runner.temp }}/spirit-screenshots/*.png
          if-no-files-found: ignore
          retention-days: 7
  apache_access:
    name: Actual Apache PHP 8.4 HTTPS access rules
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build isolated Apache test environment
        run: docker build -f tests/docker/Apache.Dockerfile -t spirit-apache-checks .
      - name: Exercise shipped access rules without external networking
        run: docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev,mode=1777 spirit-apache-checks

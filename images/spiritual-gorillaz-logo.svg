<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Spiritual Gorillaz</title>
<desc id="desc">Gold crowned Spiritual Gorillaz wordmark on a transparent background.</desc>
<defs>
  <linearGradient id="gold" x1="0" x2="0" y1="0" y2="1">
    <stop offset="0" stop-color="#ffe18a"/>
    <stop offset=".48" stop-color="#e8b64d"/>
    <stop offset="1" stop-color="#a96f18"/>
  </linearGradient>
  <linearGradient id="gold2" x1="0" x2="1">
    <stop offset="0" stop-color="#9d6513"/>
    <stop offset=".45" stop-color="#f2c65b"/>
    <stop offset="1" stop-color="#b2781f"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
    <feDropShadow dx="0" dy="10" stdDeviation="7" flood-color="#000" flood-opacity=".7"/>
  </filter>
</defs>

<g filter="url(#shadow)">
  <g transform="translate(454 8)">
    <path d="M0 86L54 126L112 38L170 126L224 86L202 186H22Z" fill="url(#gold)" stroke="#6d4210" stroke-width="8" stroke-linejoin="round"/>
    <circle cx="54" cy="126" r="13" fill="#ffe18a"/>
    <circle cx="112" cy="38" r="14" fill="#ffe18a"/>
    <circle cx="170" cy="126" r="13" fill="#ffe18a"/>
    <path d="M33 197H191" stroke="url(#gold2)" stroke-width="16" stroke-linecap="round"/>
  </g>

  <g transform="skewX(-10)">
    <text x="630" y="258" text-anchor="middle"
      fill="url(#gold)"
      stroke="#4f2d08" stroke-width="8" paint-order="stroke fill"
      font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif"
      font-size="112" font-weight="900" letter-spacing="3">SPIRITUAL</text>
    <text x="625" y="372" text-anchor="middle"
      fill="url(#gold)"
      stroke="#4f2d08" stroke-width="10" paint-order="stroke fill"
      font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif"
      font-size="152" font-weight="900" letter-spacing="1">GORILLAZ</text>
  </g>
</g>
</svg>
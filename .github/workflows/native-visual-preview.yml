name: Native visual preview
on:
  push:
    branches: [work/concept-exact-rebuild]
    paths:
      - .github/workflows/native-visual-preview.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-visual-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    services:
      database:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ephemeral-preview-root
          MYSQL_DATABASE: spirit_ci
          MYSQL_USER: spirit_ci
          MYSQL_PASSWORD: ephemeral-preview-user
        ports:
          - 3306:3306
    env:
      SPIRIT_TESTING: '1'
      SPIRIT_DISABLE_PAYMENT_NETWORK: '1'
      SPIRIT_DB_HOST: 127.0.0.1
      SPIRIT_DB_PORT: '3306'
      SPIRIT_DB_NAME: spirit_ci
      SPIRIT_DB_USER: spirit_ci
      SPIRIT_DB_PASSWORD: ephemeral-preview-user
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Configure output directory
        run: echo "SPIRIT_SCREENSHOT_DIR=$RUNNER_TEMP/spirit-screenshots" >> "$GITHUB_ENV"
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.4'
          extensions: pdo_mysql, openssl, posix, fileinfo, gd, curl, zip
          coverage: none
          ini-values: upload_max_filesize=64M, post_max_size=72M, memory_limit=512M
      - name: Build full installation ZIP
        run: |
          mkdir -p "$RUNNER_TEMP/spirit-package"
          python3 tools/package.py --output "$RUNNER_TEMP/spirit-package"
          cd "$RUNNER_TEMP/spirit-package"
          sha256sum Spiritual-Gorillaz-*-Full.zip > SHA256SUMS.txt
      - name: Install Chromium
        run: |
          python3 -m venv "$RUNNER_TEMP/spirit-browser"
          "$RUNNER_TEMP/spirit-browser/bin/pip" install playwright==1.57.0
          "$RUNNER_TEMP/spirit-browser/bin/python" -m playwright install --with-deps chromium
      - name: Render actual public build
        run: '"$RUNNER_TEMP/spirit-browser/bin/python" tests/public_browser.py'
      - name: Upload ZIP and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Spiritual-Gorillaz-native-preview-${{ github.sha }}
          path: |
            ${{ runner.temp }}/spirit-package/Spiritual-Gorillaz-*-Full.zip
            ${{ runner.temp }}/spirit-package/SHA256SUMS.txt
            ${{ runner.temp }}/spirit-screenshots/*.png
          if-no-files-found: warn
          retention-days: 14

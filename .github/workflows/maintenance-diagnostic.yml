name: Focused maintenance diagnostics
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: maintenance-diagnostic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  maintenance:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    services:
      database:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ephemeral-ci-root-not-production
          MYSQL_DATABASE: spirit_ci
          MYSQL_USER: spirit_ci
          MYSQL_PASSWORD: ephemeral-ci-user-not-production
        ports:
          - 3306:3306
    env:
      SPIRIT_TESTING: '1'
      SPIRIT_DISABLE_PAYMENT_NETWORK: '1'
      SPIRIT_DB_HOST: 127.0.0.1
      SPIRIT_DB_PORT: '3306'
      SPIRIT_DB_NAME: spirit_ci
      SPIRIT_DB_USER: spirit_ci
      SPIRIT_DB_PASSWORD: ephemeral-ci-user-not-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.4'
          extensions: pdo_mysql, openssl, posix, fileinfo, gd, curl, zip
          ini-values: upload_max_filesize=32M, post_max_size=40M
          coverage: none
      - name: Verify database and installer foundation
        run: python3 tests/http_integration.py
      - name: Run unchanged maintenance assertions and record diagnostic notices
        run: python3 tests/maintenance_diagnostic.py
      - name: Preserve synthetic failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Spirit-maintenance-${{ github.sha }}
          path: ${{ runner.temp }}/spirit-maintenance-evidence/diagnostic.json
          if-no-files-found: ignore
          retention-days: 3

name: Apply sharp native fallbacks
on:
  push:
    branches: [work/concept-exact-rebuild]
    paths:
      - .github/workflows/apply-native-fallbacks.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: work/concept-exact-rebuild
          persist-credentials: true
      - name: Remove low-resolution concept crops and wire sharp native fallbacks
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          sections_path = Path('views/public/sections.php')
          sections = sections_path.read_text(encoding='utf-8')
          replacements = {
              '<img src="<?=e(app_url(\'images/shows-concept.svg\'))?>" width="700" height="480" class="section-feature concept-shows-art" alt="" aria-hidden="true">':
              '<img src="<?=e(app_url(\'images/spiritual-gorillaz-home-hero.png\'))?>" width="2288" height="1824" class="shows-native-art" alt="" aria-hidden="true">',
              '<img class="band-image" width="248" height="277" src="<?=e(app_url(\'images/gorilla-hero.webp\'))?>" alt="Spiritual Gorillaz crowned gorilla artwork">':
              '<img class="band-image band-native-art" width="2288" height="1824" src="<?=e(app_url(\'images/spiritual-gorillaz-home-hero.png\'))?>" alt="Spiritual Gorillaz crowned gorilla stage artwork">',
              '<section class="page-hero concept-merch"><div><p class="eyebrow">SPIRITUAL GORILLAZ</p><h1>OFFICIAL MERCH</h1><p class="gold-subtitle">Take a little of the music with you.</p></div></section>':
              '<section class="page-hero concept-merch"><div><p class="eyebrow">SPIRITUAL GORILLAZ</p><h1>OFFICIAL MERCH</h1><p class="gold-subtitle">Take a little of the music with you.</p></div><img class="merch-native-art" width="2288" height="1824" src="<?=e(app_url(\'images/spiritual-gorillaz-home-hero.png\'))?>" alt="" aria-hidden="true"></section>',
          }
          for old, new in replacements.items():
              if old not in sections:
                  raise RuntimeError('Expected sections.php target not found: ' + old[:90])
              sections = sections.replace(old, new, 1)
          sections_path.write_text(sections, encoding='utf-8')

          booking_path = Path('views/public/booking.php')
          booking = booking_path.read_text(encoding='utf-8')
          old_booking = "<?php if($contact):?><p class=\"contact-email\">Prefer email? <a href=\"mailto:<?=e($contact)?>\"><?=e($contact)?></a></p><?php endif;?><?=SectionPages::artwork($pageContent)?></div>"
          new_booking = "<?php if($contact):?><p class=\"contact-email\">Prefer email? <a href=\"mailto:<?=e($contact)?>\"><?=e($contact)?></a></p><?php endif;?><?php if(!empty($pageContent['data']['image_id'])):?><?=SectionPages::artwork($pageContent)?><?php else:?><img class=\"booking-native-art\" width=\"1808\" height=\"1280\" src=\"<?=e(app_url('images/spiritual-gorillaz-music-hero.png'))?>\" alt=\"\" aria-hidden=\"true\"><?php endif;?></div>"
          if old_booking not in booking:
              raise RuntimeError('Expected booking.php artwork target not found')
          booking_path.write_text(booking.replace(old_booking, new_booking, 1), encoding='utf-8')

          store_path = Path('views/public/store.php')
          store = store_path.read_text(encoding='utf-8')
          old_store = "<?php if($view==='catalog'){echo SectionPages::artwork($pageContent);} ?>"
          new_store = "<?php if($view==='catalog'){if(!empty($pageContent['data']['image_id'])){echo SectionPages::artwork($pageContent);}else{echo '<img class=\"merch-native-art\" width=\"2288\" height=\"1824\" src=\"'.e(app_url('images/spiritual-gorillaz-home-hero.png')).'\" alt=\"\" aria-hidden=\"true\">';}} ?>"
          if old_store not in store:
              raise RuntimeError('Expected store.php artwork target not found')
          store_path.write_text(store.replace(old_store, new_store, 1), encoding='utf-8')

          css_path = Path('assets/css/section-pages.css')
          css = css_path.read_text(encoding='utf-8')
          marker = '/* === SHARP NATIVE FALLBACK PASS === */'
          if marker in css:
              raise RuntimeError('Native fallback CSS already present')
          css += r'''

          /* === SHARP NATIVE FALLBACK PASS === */
          .concept-home .hero-artwork{overflow:hidden;background:#02070c}
          .concept-home .hero-artwork .fallback-hero{clip-path:inset(7px 7px 19px 7px);mask-image:linear-gradient(90deg,transparent 0,black 17%,black 100%);transform:scale(1.018);transform-origin:right center}
          .concept-home .hero-artwork:after{background:linear-gradient(90deg,#02070cf7 0,#02070ce8 28%,rgba(2,7,12,.48) 46%,transparent 69%),linear-gradient(0deg,rgba(2,7,12,.48) 0,transparent 27%,transparent 88%,rgba(2,7,12,.28) 100%)}

          .concept-music .music-art{display:block}
          .shows-hero,.concept-band,.concept-merch,.concept-merch-heading,.concept-booking{position:relative;overflow:hidden}
          .shows-hero>div,.concept-band>div,.concept-merch>div,.concept-merch-heading>div,.concept-booking>div,.concept-booking>.details-panel{position:relative;z-index:2}
          .shows-native-art,.band-native-art,.merch-native-art,.booking-native-art{position:absolute;display:block;pointer-events:none}
          .shows-native-art{right:-3%;top:0;width:61%;height:100%;object-fit:cover;object-position:76% 70%;filter:brightness(.66) contrast(1.08) saturate(1.08);mask-image:linear-gradient(90deg,transparent 0,black 25%,black 100%)}
          .band-native-art{right:-2%;top:0;width:55%;height:100%;max-height:none;object-fit:cover;object-position:76% 32%;filter:brightness(.64) contrast(1.08);mask-image:linear-gradient(90deg,transparent 0,black 22%,black 100%)}
          .booking-native-art{left:-5%;bottom:-4%;width:57%;height:46%;object-fit:cover;object-position:66% 55%;opacity:.36;filter:brightness(.58) saturate(.8);mask-image:linear-gradient(0deg,black 0 70%,transparent 100%)}
          .concept-booking>div:first-child{padding-bottom:180px}
          .concept-merch>.merch-native-art,.concept-merch-heading>.merch-native-art{right:-2%;top:0;width:62%;height:100%;object-fit:cover;object-position:67% 76%;filter:brightness(.52) contrast(1.08) saturate(1.05);mask-image:linear-gradient(90deg,transparent 0,black 24%,black 100%)}

          @media(max-width:820px){
            .concept-home .hero-artwork{right:-42%;width:142%}
            .concept-home .hero-artwork .fallback-hero{object-fit:contain;object-position:right center;clip-path:inset(7px 7px 19px 7px);transform:scale(1.01);mask-image:linear-gradient(90deg,transparent 0,black 12%,black 100%)}
            .concept-music{min-height:480px}
            .concept-music>div{max-width:76%}
            .concept-music .music-art{display:block;right:-24%;top:0;width:92%;height:100%;object-fit:cover;object-position:60% center;opacity:.48;filter:brightness(.72) contrast(1.06);mask-image:linear-gradient(90deg,transparent 0,black 44%,black 100%)}
            .shows-native-art{width:98%;right:-43%;opacity:.58}
            .band-native-art{width:96%;right:-44%;opacity:.38}
            .booking-native-art{width:82%;height:35%;left:-20%;opacity:.28}
            .concept-booking>div:first-child{padding-bottom:145px}
            .concept-merch>.merch-native-art,.concept-merch-heading>.merch-native-art{width:105%;right:-48%;opacity:.55}
          }
          @media(max-width:600px){
            .concept-home .hero-artwork{right:-55%;width:158%}
            .concept-music{min-height:430px}
            .concept-music .music-art{right:-35%;width:112%;opacity:.42;mask-image:linear-gradient(90deg,transparent 0,black 48%,black 100%)}
            .shows-native-art{width:125%;right:-63%}
            .band-native-art{width:120%;right:-64%}
          }
          '''
          css_path.write_text(css, encoding='utf-8')
          PY
      - name: Commit sharp fallback pass
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add views/public/sections.php views/public/booking.php views/public/store.php assets/css/section-pages.css
          git commit -m "ui: remove blurry crops and use sharp native fallbacks"
          git push origin HEAD:work/concept-exact-rebuild

name: Patch concept header branding dimensions
on:
  push:
    branches: [work/concept-exact-rebuild]
    paths:
      - .github/workflows/patch-header-branding.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: work/concept-exact-rebuild
          persist-credentials: true
      - name: Align bundled logo geometry with the new SVG
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('app/Branding.php')
          text=path.read_text(encoding='utf-8')
          old='width="1200" height="420"'
          if old not in text:
              raise SystemExit('Expected bundled logo dimensions were not found')
          text=text.replace(old,'width="900" height="560"',1)
          text=text.replace('sizes="(max-width: 820px) 142px, 174px"','sizes="(max-width: 820px) 174px, 220px"',1)
          path.write_text(text,encoding='utf-8')
          PY
      - name: Commit branding geometry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/Branding.php
          git commit -m "brand: align logo intrinsic dimensions"
          git push origin HEAD:work/concept-exact-rebuild

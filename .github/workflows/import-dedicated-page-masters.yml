name: Import dedicated page masters
on:
  push:
    branches:
      - work/concept-exact-rebuild
    paths:
      - .github/workflows/import-dedicated-page-masters.yml
permissions:
  contents: write
jobs:
  import-artwork:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: work/concept-exact-rebuild
          persist-credentials: true
      - name: Download production artwork
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p images
          curl --fail --location --retry 4 --retry-all-errors --output images/spiritual-gorillaz-shows-hero.png "https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:91120f32-8a0d-484b-bcbd-0fea8f5350d9"
          curl --fail --location --retry 4 --retry-all-errors --output images/spiritual-gorillaz-band-hero.png "https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:3abf9f6c-fac2-4475-9bab-b77aa6527f44"
          curl --fail --location --retry 4 --retry-all-errors --output images/spiritual-gorillaz-booking-hero.png "https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:d2378e48-3d80-45f0-8bb2-e0417e59f74f"
          curl --fail --location --retry 4 --retry-all-errors --output images/spiritual-gorillaz-merch-hero.png "https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:8d9afeae-f195-4a1e-a34c-cc88bc9f228a"
          for file in images/spiritual-gorillaz-{shows,band,booking,merch}-hero.png; do
            test "$(stat -c%s "$file")" -gt 100000
            file "$file"
          done
      - name: Commit artwork
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/import-dedicated-page-masters.yml
          git add images/spiritual-gorillaz-shows-hero.png images/spiritual-gorillaz-band-hero.png images/spiritual-gorillaz-booking-hero.png images/spiritual-gorillaz-merch-hero.png
          git commit -m "art: add dedicated Shows Band Booking and Merch masters"
          git push origin HEAD:work/concept-exact-rebuild

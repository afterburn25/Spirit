name: Populated storefront browser verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: storefront-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gallery:
    name: Storefront / ${{ matrix.browser }}
    runs-on: ubuntu-22.04
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    services:
      database:
        image: mariadb:11.4
        env:
          MYSQL_ROOT_PASSWORD: ephemeral-ci-root-not-production
          MYSQL_DATABASE: spirit_ci
          MYSQL_USER: spirit_ci
          MYSQL_PASSWORD: ephemeral-ci-user-not-production
        ports:
          - 3306:3306
    env:
      SPIRIT_TESTING: '1'
      SPIRIT_DISABLE_PAYMENT_NETWORK: '1'
      SPIRIT_DB_HOST: 127.0.0.1
      SPIRIT_DB_PORT: '3306'
      SPIRIT_DB_NAME: spirit_ci
      SPIRIT_DB_USER: spirit_ci
      SPIRIT_DB_PASSWORD: ephemeral-ci-user-not-production
      SPIRIT_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.4'
          extensions: pdo_mysql, openssl, posix, fileinfo, gd, curl, zip
          coverage: none
      - name: Prepare browser and synthetic evidence directory
        run: |
          echo "SPIRIT_SCREENSHOT_DIR=$RUNNER_TEMP/spirit-gallery-screens" >> "$GITHUB_ENV"
          python3 -m venv "$RUNNER_TEMP/spirit-browser"
          "$RUNNER_TEMP/spirit-browser/bin/pip" install playwright==1.57.0
          "$RUNNER_TEMP/spirit-browser/bin/python" -m playwright install --with-deps "$SPIRIT_BROWSER"
      - name: Provide an audio output device on the disposable browser runner
        run: |
          sudo apt-get install -y --no-install-recommends pulseaudio pulseaudio-utils
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=spirit_ci_audio
          pactl set-default-sink spirit_ci_audio
          pactl info
          pactl list short sinks
      - name: Verify published gallery, actual image selection and fallback
        run: |
          php tests/gallery_unit.php
          set -o pipefail
          "$RUNNER_TEMP/spirit-browser/bin/python" tests/gallery_browser.py 2>&1 | tee "$RUNNER_TEMP/spirit-gallery.log"
      - name: Review release pages, native access and checkout without charging
        run: |
          set -o pipefail
          "$RUNNER_TEMP/spirit-browser/bin/python" tests/release_browser.py 2>&1 | tee "$RUNNER_TEMP/spirit-release.log"
      - name: Verify grouped administration navigation and remembered state
        run: |
          set -o pipefail
          "$RUNNER_TEMP/spirit-browser/bin/python" tests/admin_navigation_browser.py 2>&1 | tee "$RUNNER_TEMP/spirit-navigation.log"
      - name: Verify managed section artwork and saved-draft previews
        run: |
          set -o pipefail
          "$RUNNER_TEMP/spirit-browser/bin/python" tests/section_pages_browser.py 2>&1 | tee "$RUNNER_TEMP/spirit-sections.log"
      - name: Verify native pagination and private-history restoration
        run: |
          set -o pipefail
          "$RUNNER_TEMP/spirit-browser/bin/python" tests/content_history_browser.py 2>&1 | tee "$RUNNER_TEMP/spirit-history.log"
      - name: Preserve synthetic storefront renders
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Spirit-storefront-${{ matrix.browser }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/spirit-gallery-screens/*.png
            ${{ runner.temp }}/spirit-gallery.log
            ${{ runner.temp }}/spirit-release.log
            ${{ runner.temp }}/spirit-sections.log
            ${{ runner.temp }}/spirit-navigation.log
            ${{ runner.temp }}/spirit-history.log
          if-no-files-found: ignore
          retention-days: 7

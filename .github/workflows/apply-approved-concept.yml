name: Apply approved concept native assets
on:
  push:
    branches: [work/approved-concept-native]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: work/approved-concept-native
          fetch-depth: 0
      - name: Download verified concept patch
        run: |
          curl -L --fail --retry 3 --retry-delay 2 -o "$RUNNER_TEMP/concept-patch.zip" "https://at.adobe.com/8HruP7r53PZXvwJ0"
          echo "b805bbdb87ec51241175f1343bf7e9dc8d1b27f682f95bc7e50b8ea6f7582558  $RUNNER_TEMP/concept-patch.zip" | sha256sum -c -
      - name: Apply native-resolution implementation
        run: |
          unzip -o "$RUNNER_TEMP/concept-patch.zip" -d .
          rm -f .github/workflows/apply-approved-concept.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement approved concept with native production assets"
          git push origin HEAD:work/approved-concept-native

name: Apply approved animated logo
on:
  push:
    branches: [work/approved-concept-native]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: work/approved-concept-native
          fetch-depth: 0
      - name: Download and verify approved transparent logo assets
        run: |
          curl -L --fail --retry 3 --retry-delay 2 -o images/spiritual-gorillaz-logo.png "https://at.adobe.com/O8TV7C1vvfIYFVk8"
          curl -L --fail --retry 3 --retry-delay 2 -o images/spiritual-gorillaz-logo-static.png "https://at.adobe.com/7m1qwBIROMGthIo1"
          echo "d95139c9dcba3607312ceee18ee219fe12ffa9c117a50075e0ee497ddc2db338  images/spiritual-gorillaz-logo.png" | sha256sum -c -
          echo "3f37763d8e6e75c5f78582e919b5944eefb2a8da6826a74269d5ce3a0f2e1a04  images/spiritual-gorillaz-logo-static.png" | sha256sum -c -
      - name: Integrate animation, static fallback and responsive sizing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          branding = Path('app/Branding.php')
          text = branding.read_text()
          old = '''    /** Bundled scalable fallback mirrors the existing crown + wordmark identity. */
              public static function bundledMark(bool $footer = false): string
              {
                  $file=Paths::root().'/images/spiritual-gorillaz-logo.png';
                  if(!is_file($file)||is_link($file)){return '';}
                  return '<span class="bundled-brand-wrap"><img class="bundled-site-logo" src="'.e(app_url('images/spiritual-gorillaz-logo.png')).'" width="1536" height="1024" alt="" loading="'.($footer?'lazy':'eager').'" decoding="async"></span>';
              }
          '''
          # Keep exact indentation from source while avoiding fragile whitespace matching.
          start = text.index('    /** Bundled scalable fallback mirrors the existing crown + wordmark identity. */')
          end = text.index('    /** Original ratio and transparency are retained; no arbitrary image URL. */', start)
          new = '''    /** Bundled animated fallback uses the approved transparent crown-and-wordmark mark. */
              public static function bundledMark(bool $footer = false): string
              {
                  $animated = Paths::root().'/images/spiritual-gorillaz-logo.png';
                  $static = Paths::root().'/images/spiritual-gorillaz-logo-static.png';
                  $animatedReady = is_file($animated) && !is_link($animated);
                  $staticReady = is_file($static) && !is_link($static);
                  if (!$animatedReady && !$staticReady) { return ''; }

                  $staticUrl = e(app_url('images/spiritual-gorillaz-logo-static.png'));
                  if ($footer || !$animatedReady) {
                      return '<span class="bundled-brand-wrap bundled-brand-static"><img class="bundled-site-logo" src="'.$staticUrl.'" width="600" height="600" alt="" loading="'.($footer ? 'lazy' : 'eager').'" decoding="async"></span>';
                  }

                  $source = $staticReady ? '<source media="(prefers-reduced-motion: reduce)" srcset="'.$staticUrl.'">' : '';
                  return '<span class="bundled-brand-wrap bundled-brand-animated"><picture class="bundled-brand-picture">'.$source.'<img class="bundled-site-logo bundled-site-logo-animated" src="'.e(app_url('images/spiritual-gorillaz-logo.png')).'" width="600" height="600" alt="" loading="eager" fetchpriority="high" decoding="async"></picture></span>';
              }

          '''
          branding.write_text(text[:start] + new + text[end:])

          header = Path('views/public/header.php')
          text = header.read_text()
          anchor = '<link rel="stylesheet" href="<?=e(app_url(\'assets/css/concept-fixes.css\'))?>">'
          if 'animated-logo.css' not in text:
              if anchor not in text:
                  raise SystemExit('Header stylesheet anchor not found')
              text = text.replace(anchor, anchor + '<link rel="stylesheet" href="<?=e(app_url(\'assets/css/animated-logo.css\'))?>">', 1)
          header.write_text(text)

          Path('assets/css/animated-logo.css').write_text('''/* Approved Concept 2 animated logo integration.
          Header uses transparent APNG; footer and reduced-motion users receive a static PNG. */
          .bundled-brand-picture{display:flex;align-items:center;justify-content:center;width:100%;height:100%;min-width:0}
          .bundled-brand-picture>.bundled-site-logo{display:block;width:auto!important;height:auto!important;object-fit:contain!important}
          .site-header:has(.bundled-brand-animated){height:104px;min-height:104px;grid-template-columns:126px minmax(0,1fr)}
          .site-header .wordmark:has(.bundled-brand-animated){width:112px;height:94px;justify-content:center}
          .site-header .bundled-brand-animated{justify-content:center;height:100%;min-height:0}
          .site-header .bundled-brand-animated .bundled-site-logo{max-width:94px!important;max-height:94px!important;filter:drop-shadow(0 7px 13px rgba(0,0,0,.9)) saturate(1.08)!important}
          .site-footer .bundled-brand-static{justify-content:flex-start}
          .site-footer .bundled-brand-static .bundled-site-logo{max-width:92px!important;max-height:92px!important;filter:drop-shadow(0 5px 10px rgba(0,0,0,.85)) saturate(1.06)!important}
          .branding-swatch .bundled-brand-picture{max-width:150px;max-height:150px}
          .branding-swatch .bundled-site-logo{max-width:150px!important;max-height:150px!important}
          @media(max-width:1100px){.site-header:has(.bundled-brand-animated){height:96px;min-height:96px;grid-template-columns:112px minmax(0,1fr)}.site-header .wordmark:has(.bundled-brand-animated){width:100px;height:86px}.site-header .bundled-brand-animated .bundled-site-logo{max-width:86px!important;max-height:86px!important}}
          @media(max-width:820px){.site-header:has(.bundled-brand-animated){height:82px;min-height:82px}.site-header .wordmark:has(.bundled-brand-animated){width:74px;height:72px}.site-header .bundled-brand-animated .bundled-site-logo{max-width:72px!important;max-height:72px!important}}
          @media(prefers-reduced-motion:reduce){.bundled-site-logo-animated{animation:none!important}}
          ''')

          doc = Path('docs/BRANDING.md')
          if doc.exists():
              text = doc.read_text()
              note = '''\n## Bundled animated identity\n\nWhen no owner-published Media-library logo is active, the site uses the approved Concept 2 transparent crown-and-shield logo. The header loads the transparent APNG, while the footer and visitors using `prefers-reduced-motion: reduce` receive the matching static PNG. Owner-published logos still override the bundled identity without cropping or stretching.\n'''
              if '## Bundled animated identity' not in text:
                  doc.write_text(text + note)
          PY
          php -l app/Branding.php
          php -l views/public/header.php
      - name: Commit integrated animated logo
        run: |
          rm -f .github/workflows/apply-animated-logo.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Brand site with approved transparent animated logo"
          git push origin HEAD:work/approved-concept-native

name: Apply dedicated page masters
on:
  push:
    branches:
      - work/concept-exact-rebuild
    paths:
      - .github/workflows/apply-dedicated-page-masters.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: work/concept-exact-rebuild
          persist-credentials: true
      - name: Apply page artwork integration
        run: python3 tools/apply_dedicated_page_masters.py
      - name: Commit integrated page masters
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-dedicated-page-masters.yml tools/apply_dedicated_page_masters.py
          git add views/public/sections.php views/public/booking.php views/public/store.php assets/css/section-pages.css tests/concept_preview.py docs/CONCEPT_REBUILD_STATUS.md
          git commit -m "art: integrate dedicated Shows Band Booking and Merch masters"
          git push origin HEAD:work/concept-exact-rebuild
